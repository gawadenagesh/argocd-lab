apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hello-prod
resources:
  - ../../base
replicas:
  - name: hello-gitops
    count: 3
patches:
  - target:
      kind: Deployment
      name: hello-gitops
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: prod
images:
  - name: hello-gitops
    newName: ghcr.io/gawadenagesh/hello-gitops
    newTag: stable
