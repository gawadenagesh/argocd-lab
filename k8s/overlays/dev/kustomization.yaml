apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd-lab-dev
namePrefix: dev-

resources:
- ../../base

replicas:
- count: 2
  name: hello-gitops
patches:
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/0/value
      value: dev
  target:
    kind: Deployment
    name: hello-gitops
images:
- name: hello-gitops
  newName: ghcr.io/gawadenagesh/hello-gitops
  newTag: sha-c0681a8
