apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd-lab-dev
namePrefix: dev-

resources:
  - ../../base

replicas:
  - name: hello-gitops
    count: 2
patches:
  - target:
      kind: Deployment
      name: hello-gitops
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: dev
images:
  - name: hello-gitops
    newName: ghcr.io/gawadenagesh/hello-gitops
    newTag: dev