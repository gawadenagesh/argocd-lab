apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-lab-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/gawadenagesh/argocd-lab.git
    targetRevision: HEAD
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd-lab-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
